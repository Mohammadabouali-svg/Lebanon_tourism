# nginx in development serves the Laravel API only. The React app is served
# by the Vite dev server, which proxies /api, /sanctum and /storage to us.

server {
    listen 80;
    server_name _;

    root /var/www/backend/public;
    index index.php;

    # Must be at least as large as PHP's post_max_size.
    client_max_body_size 10m;

    # Uploaded images are plain files: nginx serves them directly and never
    # hands them to PHP, so an uploaded "image.php" could never run as code.
    location /storage/ {
        alias /var/www/backend/storage/app/public/;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # Laravel has exactly one PHP entry point. Only that file is executed.
    location = /index.php {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    # Any other *.php request is refused.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

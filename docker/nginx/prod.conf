# nginx in production serves everything from one origin:
#   /            → the built React app (static files)
#   /api, /sanctum → Laravel (PHP-FPM)
#   /storage     → uploaded images (static files on a shared volume)
#
# One origin means the browser never makes cross-origin requests, so there is
# no CORS configuration to get wrong and cookies "just work".
#
# TLS is expected to be terminated in front of this container (a load
# balancer, Traefik, Caddy, ...). See docs/09-deployment.md.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /storage/ {
        alias /var/www/backend/storage/app/public/;
        add_header X-Content-Type-Options "nosniff" always;
        expires 7d;
        try_files $uri =404;
    }

    # API and Sanctum requests go to Laravel's front controller.
    location ~ ^/(api|sanctum)/ {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_hide_header X-Powered-By;
    }

    # Vite puts a content hash in every asset file name (app-3f2a1c.js), so
    # those files can be cached "forever": a new build produces new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is a page of the single-page app. React Router decides
    # what to render, so unknown paths fall back to index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# nginx in production serves everything from one origin:
#   /            → the built React app (static files)
#   /api, /sanctum → Laravel (PHP-FPM)
#   /storage     → uploaded images (static files on a shared volume)
#
# One origin means the browser never makes cross-origin requests, so there is
# no CORS configuration to get wrong and cookies "just work".
#
# TLS is expected to be terminated in front of this container (a load
# balancer, Traefik, Caddy, ...). See docs/09-deployment.md.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    # Must be at least as large as PHP's post_max_size (a review with three
    # 5 MB photos, see docker/php/conf.d/app.ini).
    client_max_body_size 20m;

    # Content-Security-Policy (CSP): the browser refuses to load or run
    # anything the policy does not allow. It is a second line of defence
    # against XSS: React already escapes everything it renders, but if markup
    # were ever injected, a <script> or onerror="..." in it would not run.
    #
    # Default for every response that is not the React page (JSON from
    # /api, uploaded images, bundles, errors): such a response never needs
    # to load anything, so it may load nothing and never be framed. If an
    # upload were ever opened as a document, it could not run script either.
    set $content_security_policy "default-src 'none'; frame-ancestors 'none'";

    # The page policy, used in `location /` below (index.html):
    #   default-src 'self'      fallback for every type not listed: own origin only
    #   script-src 'self'       only our bundles; no 'unsafe-inline' / 'unsafe-eval',
    #                           so injected <script> and onclick="..." never run
    #   style-src 'self'        the one Tailwind CSS file; React style={{...}} props
    #                           are set through the CSSOM, which CSP does not block
    #   img-src 'self' blob:    own images and /storage; blob: for the upload
    #                           previews (URL.createObjectURL). No data: (unused)
    #   connect-src 'self'      axios only talks to our /api and /sanctum
    #   font-src 'self'         no web fonts today; stated instead of implied
    #   object-src 'none'       no <object>/<embed> plugins
    #   base-uri 'none'         no <base> tag, so an injected one cannot
    #                           redirect every relative URL
    #   form-action 'self'      a form can only submit to us
    #   frame-ancestors 'none'  never shown in a frame (clickjacking)
    # Not used: upgrade-insecure-requests. Every URL is relative (same
    # origin), and HTTPS is the TLS proxy's job (docs/09-deployment.md).
    # See docs/decisions.md D22, also for what Stripe (Exercise 9) would need.
    set $page_content_security_policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";

    include /etc/nginx/snippets/security-headers.conf;

    location /storage/ {
        alias /var/www/backend/storage/app/public/;
        include /etc/nginx/snippets/security-headers.conf;
        expires 7d;
        try_files $uri =404;
    }

    # API and Sanctum requests go to Laravel's front controller.
    location ~ ^/(api|sanctum)/ {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_hide_header X-Powered-By;
    }

    # Vite puts a content hash in every asset file name (app-3f2a1c.js), so
    # those files can be cached "forever": a new build produces new names.
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is a page of the single-page app. React Router decides
    # what to render, so unknown paths fall back to index.html.
    location / {
        set $content_security_policy $page_content_security_policy;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

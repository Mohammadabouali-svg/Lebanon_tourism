# Security headers for every response of the production server.
#
# Included by prod.conf at server level AND inside every location that has
# an `add_header` of its own. nginx inherits `add_header` from the enclosing
# block only when a block defines none itself: a single `add_header
# Cache-Control ...` in a location silently drops every server-level header
# for that location. Before Exercise 7 that is exactly what happened to
# index.html, the bundles and /storage (docs/decisions.md D22).
#
# Rule: a location that uses `add_header` must `include` this file too.
#
# `always` adds the headers to error responses (404, 500, ...) as well.

add_header X-Content-Type-Options "nosniff" always;
# Old browsers only know X-Frame-Options; modern ones use the CSP
# `frame-ancestors 'none'`. Both say "never show this site in a frame".
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The policy itself is chosen per location in prod.conf through this
# variable: a strict "load nothing" policy by default, and the page policy
# for the React app. Exactly one CSP header per response: browsers enforce
# every CSP header they get, so two of them would combine into the
# strictest intersection and break the page.
add_header Content-Security-Policy $content_security_policy always;

; Production: never print errors to visitors (they leak paths, SQL and secrets).
; Laravel logs them to stderr instead, where `docker logs` can collect them.
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; The code inside a production image never changes, so PHP can skip checking
; file timestamps on every request.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

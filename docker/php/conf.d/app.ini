; Settings shared by every environment.

; Uploads: tour images and review photos are limited to 5 MB by Laravel's
; validation. PHP's own limits must be a bit higher, otherwise PHP silently
; drops the file before Laravel can return a friendly validation error.
upload_max_filesize = 8M
post_max_size = 10M

memory_limit = 256M
expose_php = Off

; Always work in UTC on the server. The frontend converts to the visitor's
; local time zone for display.
date.timezone = UTC
